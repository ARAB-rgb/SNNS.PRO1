<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070a14"><title>تثبيت SNNS</title><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"><style>
.download-shell{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 80% 10%,rgba(0,209,255,.12),transparent 30%),radial-gradient(circle at 20% 90%,rgba(124,58,237,.14),transparent 34%),#070a14;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.download-wrap{width:min(620px,100%)}.download-head{text-align:center}.download-logo{width:86px;height:86px;border-radius:24px;box-shadow:0 0 38px rgba(0,209,255,.22)}.download-head h1{font-size:34px;margin:14px 0 6px}.download-head p{color:#9aa6c4;line-height:1.8}.download-card{margin-top:24px;background:#0c1222;border:1px solid #1d2a46;border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:16px;box-shadow:0 16px 50px rgba(0,0,0,.24);text-align:center}.platform{font-size:38px}.download-btn{border:0;border-radius:14px;padding:14px 18px;background:linear-gradient(135deg,#00d1ff,#6d4cff);color:#fff;font-weight:800;cursor:pointer;font-size:16px}.download-btn:hover{filter:brightness(1.1)}.install-note{padding:14px 18px;border:1px solid #263756;background:#0b1020;border-radius:16px;color:#aab5cd;line-height:1.8}.back-home{display:inline-block;margin-top:20px;color:#9fdfff;text-decoration:none;font-weight:600}.download-lang{position:fixed;top:18px;inset-inline-end:18px;background:#111a2d;color:#fff;border:1px solid #263756;border-radius:12px;padding:9px 12px}@media(max-width:600px){.download-shell{padding:18px}.download-head h1{font-size:28px}}
</style></head><body><select id="downloadLang" class="download-lang" aria-label="Language"><option value="ar">العربية</option><option value="en">English</option></select><main class="download-shell"><div class="download-wrap"><header class="download-head"><img class="download-logo" src="/icon-192.png" alt="SNNS"><h1 id="dlTitle">ثبّت SNNS على جهازك</h1><p id="dlDesc">نفس حسابك ورسائلك ومكالماتك، كتطبيق سريع على جهازك.</p></header><section class="download-card"><div class="platform">⇩</div><button id="installPwaBtn" class="download-btn" type="button">تثبيت تطبيق SNNS</button><div id="installNote" class="install-note">على iPhone و iPad: اضغط زر المشاركة ⎋ ثم اختر «إضافة إلى الشاشة الرئيسية». على Chrome أو Android: اضغط زر التثبيت أعلاه.</div></section><a id="dlBack" class="back-home" href="/">← العودة إلى منصة SNNS</a></div></main><script>
let deferredPrompt;
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();
  deferredPrompt=e;
  const btn=document.getElementById('installPwaBtn');
  if(btn){
    btn.style.display='block';
    btn.addEventListener('click',async()=>{
      if(deferredPrompt){
        deferredPrompt.prompt();
        const choice=await deferredPrompt.userChoice;
        if(choice.outcome==='accepted'){
          document.getElementById('installNote').textContent='تم التثبيت بنجاح على جهازك!';
        }
        deferredPrompt=null;
      }
    });
  }
});
</script></body></html>
