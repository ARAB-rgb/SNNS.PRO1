<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a122c"/>
      <stop offset="60%" stop-color="#050711"/>
      <stop offset="100%" stop-color="#020308"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d1ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#d946ef" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="sGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#c084fc"/>
      <stop offset="55%" stop-color="#f43f5e"/>
      <stop offset="85%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Outer ambient ring glow -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#a855f7" stroke-width="6" opacity="0.4" filter="url(#softGlow)"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.85"/>

  <!-- Glowing S letter path with 3D glass sweep -->
  <g filter="url(#glow)">
    <path d="M 345 155 C 340 115 305 85 255 85 C 195 85 155 125 155 175 C 155 235 205 260 270 280 C 335 300 365 330 365 380 C 365 440 315 480 250 480 C 180 480 135 440 130 380 L 195 365 C 198 400 220 425 255 425 C 290 425 315 405 315 375 C 315 335 280 315 210 290 C 150 268 110 238 110 180 C 110 120 160 80 245 80 C 315 80 355 120 360 165 Z" fill="url(#sGrad)"/>
    <!-- Highlight sheen -->
    <path d="M 330 145 C 325 120 295 100 255 100 C 210 100 175 130 175 170 C 175 215 215 240 270 260 C 310 275 340 295 345 330 C 335 295 305 275 260 258 C 190 232 145 205 145 165 C 145 115 190 85 255 85 C 300 85 335 112 340 145 Z" fill="#ffffff" opacity="0.35"/>
  </g>
</svg>
